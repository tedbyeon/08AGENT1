                - link "\"냉면에도, 뜨끈한 국수에도 빠질 수 없는…\" 광복절에 꺼내보는 내가 뽑은 '인생 만두' 맛지도~! \"냉면에도, 뜨끈한 국수에도 빠질 수 없는…\" 광복절에 꺼내보는 내가 뽑은 '인생 만두' 맛지도~! 오늘은 광복 81주년을 맞이하는 뜻깊은 8월 15일입니다.빼앗겼던 빛을 되찾고 오늘날의 풍요를 누리기까지 수많은 세월이 흘렀지만, 우리 곁에는 여전히 묵묵히 그 시간의 깊이를 지켜내고 있는 소중한 음식들이 있습니다. 제게는 그중 으뜸이 바로 '만두'입니다. 사시사철 무더운 여름 시원한 냉면 한 그릇을 먹을 때도, 찬 바람 부는 날 뜨끈한 국수를 들이켤 때도 식탁 위에 결코 빠지지 않는 소울푸드. 평소 만두를 워낙 좋아해 맛있는 곳이 있다면 전국 어디든 찾아다니곤 하지만, 특히 오랜 내공으로 손수 빚어낸 만두를 마주할 때면 언제나 뚝심 있는 장인정신과 세월의 무게가 고스란히 전해집니다. 빠르게 변하.. 좋아요 31 댓글 17 1일 전 게시글 이미지" [ref=e213] [cursor=pointer]:
